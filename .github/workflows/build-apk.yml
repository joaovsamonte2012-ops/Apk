name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/capybara/toolkit
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'CapybaraToolkit'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.capybara.toolkit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.capybara.toolkit'
                  minSdk 26
                  targetSdk 28
                  versionCode 1
                  versionName '2.0-film'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="Capybara Toolkit"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false" />

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">monospace</item>
                  <item name="android:colorAccent">#00FF88</item>
                  <item name="android:windowBackground">#050A08</item>
                  <item name="android:statusBarColor">#050A08</item>
                  <item name="android:navigationBarColor">#050A08</item>
              </style>

          </resources>
          EOF

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/capybara/toolkit/MainActivity.java <<'EOF'
          package com.capybara.toolkit;

          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private TextView text(String value, int size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextColor(Color.rgb(0, 255, 136));
                  t.setTextSize(size);
                  t.setPadding(20, 20, 20, 20);
                  return t;
              }

              private Button button(String value) {
                  Button b = new Button(this);
                  b.setText(value);
                  return b;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(30, 80, 30, 30);
                  root.setBackgroundColor(Color.rgb(5, 10, 8));

                  root.addView(text("CAPYBARA TOOLKIT", 26));
                  root.addView(text("FILM PROP // OVERLAY SYSTEM", 14));
                  root.addView(text("Visual simulation only", 13));

                  Button permission = button("AUTHORIZE OVERLAY");
                  Button start = button("START TOOLKIT");
                  Button stop = button("STOP TOOLKIT");

                  root.addView(permission);
                  root.addView(start);
                  root.addView(stop);

                  permission.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(intent);
                      }
                  });

                  start.setOnClickListener(v -> {
                      if (
                          Build.VERSION.SDK_INT < Build.VERSION_CODES.M ||
                          Settings.canDrawOverlays(this)
                      ) {
                          startService(
                              new Intent(this, OverlayService.class)
                          );
                      } else {
                          Toast.makeText(
                              this,
                              "Authorize overlay first",
                              Toast.LENGTH_SHORT
                          ).show();
                      }
                  });

                  stop.setOnClickListener(v ->
                      stopService(
                          new Intent(this, OverlayService.class)
                      )
                  );

                  setContentView(root);
              }
          }
          EOF

      - name: Create OverlayService
        run: |
          cat > app/src/main/java/com/capybara/toolkit/OverlayService.java <<'EOF'
          package com.capybara.toolkit;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class OverlayService extends Service {

              private WindowManager windowManager;
              private LinearLayout panel;
              private TextView status;
              private TextView log;

              private TextView label(String value) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextColor(Color.rgb(0, 255, 136));
                  t.setTextSize(13);
                  t.setPadding(14, 10, 14, 10);
                  return t;
              }

              private Button button(String value) {
                  Button b = new Button(this);
                  b.setText(value);
                  return b;
              }

              private void message(String value) {
                  log.setText("> " + value + "\n" + log.getText());
              }

              @Override
              public void onCreate() {
                  super.onCreate();

                  windowManager =
                      (WindowManager) getSystemService(WINDOW_SERVICE);

                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(20, 20, 20, 20);

                  GradientDrawable background =
                      new GradientDrawable();

                  background.setColor(Color.rgb(5, 12, 10));
                  background.setStroke(
                      2,
                      Color.rgb(0, 255, 136)
                  );
                  background.setCornerRadius(20);

                  panel.setBackground(background);

                  panel.addView(
                      label("CAPYBARA TOOLKIT // v2.0")
                  );

                  panel.addView(
                      label("TARGET: CAPYBARA GO")
                  );

                  panel.addView(
                      label("LINK: READY")
                  );

                  status = label("STATUS: STANDBY");
                  panel.addView(status);

                  log = label("> awaiting command...");
                  panel.addView(log);

                  String[] commands = {
                      "ATTACH // SIMULATE",
                      "COINS +999K",
                      "GEMS +99K",
                      "DAMAGE x99",
                      "SPEED x4",
                      "GOD MODE",
                      "TRIGGER DETECTION",
                      "RESET SCENE",
                      "CLOSE"
                  };

                  for (String command : commands) {

                      Button b = button(command);

                      panel.addView(b);

                      b.setOnClickListener(v -> {

                          String c =
                              ((Button) v).getText().toString();

                          if (c.equals("ATTACH // SIMULATE")) {

                              message(
                                  "[link] target attached (visual simulation)"
                              );

                          } else if (c.startsWith("COINS")) {

                              message(
                                  "[wallet] coin visual override staged"
                              );

                          } else if (c.startsWith("GEMS")) {

                              message(
                                  "[wallet] gem visual override staged"
                              );

                          } else if (c.startsWith("DAMAGE")) {

                              message(
                                  "[combat] multiplier staged"
                              );

                          } else if (c.startsWith("SPEED")) {

                              message(
                                  "[engine] speed flag staged"
                              );

                          } else if (c.equals("GOD MODE")) {

                              message(
                                  "[combat] protection flag staged"
                              );

                          } else if (
                              c.equals("TRIGGER DETECTION")
                          ) {

                              status.setText(
                                  "STATUS: ANOMALOUS ACTIVITY DETECTED"
                              );

                              message(
                                  "[security] simulated detection triggered"
                              );

                          } else if (
                              c.equals("RESET SCENE")
                          ) {

                              status.setText(
                                  "STATUS: STANDBY"
                              );

                              log.setText(
                                  "> awaiting command..."
                              );

                          } else if (
                              c.equals("CLOSE")
                          ) {

                              stopSelf();
                          }
                      });
                  }

                  int type;

                  if (Build.VERSION.SDK_INT >= 26) {

                      type =
                          WindowManager.LayoutParams
                              .TYPE_APPLICATION_OVERLAY;

                  } else {

                      type =
                          WindowManager.LayoutParams
                              .TYPE_PHONE;
                  }

                  WindowManager.LayoutParams params =
                      new WindowManager.LayoutParams(
                          700,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  params.gravity =
                      Gravity.TOP | Gravity.START;

                  params.x = 20;
                  params.y = 150;

                  windowManager.addView(
                      panel,
                      params
                  );
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();

                  if (panel != null) {
                      windowManager.removeView(panel);
                  }
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapybaraToolkit-APK
          path: app/build/outputs/apk/debug/app-debug.apk
