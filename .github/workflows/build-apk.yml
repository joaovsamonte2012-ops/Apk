
 name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/capybara/toolkit

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'CapybaraToolkit'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.capybara.toolkit'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.capybara.toolkit'
                  minSdk 26
                  targetSdk 28
                  versionCode 1
                  versionName '2.0-film'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Capybara Toolkit">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"/>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">monospace</item>
                  <item name="android:colorAccent">#00FF88</item>
                  <item name="android:navigationBarColor">#050A08</item>
                  <item name="android:statusBarColor">#050A08</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/capybara/toolkit/MainActivity.java <<'EOF'
          package com.capybara.toolkit;

          import android.app.*;
          import android.os.*;
          import android.provider.Settings;
          import android.content.*;
          import android.graphics.Color;
          import android.net.Uri;
          import android.view.*;
          import android.widget.*;

          public class MainActivity extends Activity {

              LinearLayout root;

              TextView text(String value, int size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextColor(Color.rgb(0,255,136));
                  t.setTextSize(size);
                  t.setPadding(20,20,20,20);
                  return t;
              }

              Button button(String value) {
                  Button b = new Button(this);
                  b.setText(value);
                  return b;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(30,80,30,30);
                  root.setBackgroundColor(Color.rgb(5,10,8));

                  root.addView(text("CAPYBARA TOOLKIT",26));
                  root.addView(text("FILM PROP // OVERLAY SYSTEM",14));
                  root.addView(text("\nVisual simulation only.",14));

                  Button permission = button("AUTHORIZE OVERLAY");
                  Button start = button("START TOOLKIT");
                  Button stop = button("STOP TOOLKIT");

                  root.addView(permission);
                  root.addView(start);
                  root.addView(stop);

                  permission.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= 23) {
                          Intent i = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(i);
                      }
                  });

                  start.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(this)) {
                          startService(new Intent(this, OverlayService.class));
                      } else {
                          Toast.makeText(this,
                              "Authorize overlay first",
                              Toast.LENGTH_SHORT).show();
                      }
                  });

                  stop.setOnClickListener(v ->
                      stopService(new Intent(this, OverlayService.class))
                  );

                  setContentView(root);
              }
          }
          EOF

      - name: Create Overlay
        run: |
          cat > app/src/main/java/com/capybara/toolkit/OverlayService.java <<'EOF'
          package com.capybara.toolkit;

          import android.app.*;
          import android.os.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.view.*;
          import android.widget.*;
          import android.content.*;

          public class OverlayService extends Service {

              WindowManager wm;
              LinearLayout panel;
              TextView status;
              TextView log;

              TextView label(String s) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(Color.rgb(0,255,136));
                  t.setTextSize(13);
                  t.setPadding(14,10,14,10);
                  return t;
              }

              Button button(String s) {
                  Button b = new Button(this);
                  b.setText(s);
                  return b;
              }

              void message(String s) {
                  log.setText("> " + s + "\n" + log.getText());
              }

              @Override
              public void onCreate() {
                  super.onCreate();

                  wm = (WindowManager)getSystemService(WINDOW_SERVICE);

                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(20,20,20,20);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.rgb(5,12,10));
                  bg.setStroke(2, Color.rgb(0,255,136));
                  bg.setCornerRadius(20);
                  panel.setBackground(bg);

                  panel.addView(label("CAPYBARA TOOLKIT // v2.0"));
                  panel.addView(label("TARGET: CAPYBARA GO"));
                  panel.addView(label("LINK: READY"));

                  status = label("STATUS: STANDBY");
                  panel.addView(status);

                  log = label("> awaiting command...");
                  panel.addView(log);

                  String[] commands = {
                      "ATTACH // SIMULATE",
                      "COINS +999K",
                      "GEMS +99K",
                      "DAMAGE x99",
                      "SPEED x4",
                      "GOD MODE",
                      "TRIGGER DETECTION",
                      "RESET SCENE",
                      "CLOSE"
                  };

                  for (String command : commands) {
                      Button b = button(command);
                      panel.addView(b);

                      b.setOnClickListener(v -> {
                          String c = ((Button)v).getText().toString();

                          if (c.equals("ATTACH // SIMULATE"))
                              message("[link] target attached (visual simulation)");

                          else if (c.startsWith("COINS"))
                              message("[wallet] coin visual override staged");

                          else if (c.startsWith("GEMS"))
                              message("[wallet] gem visual override staged");

                          else if (c.startsWith("DAMAGE"))
                              message("[combat] multiplier staged");

                          else if (c.startsWith("SPEED"))
                              message("[engine] speed flag staged");

                          else if (c.equals("GOD MODE"))
                              message("[combat] protection flag staged");

                          else if (c.equals("TRIGGER DETECTION")) {
                              status.setText("STATUS: ANOMALOUS ACTIVITY DETECTED");
                              message("[security] simulated detection triggered");
                          }

                          else if (c.equals("RESET SCENE")) {
                              status.setText("STATUS: STANDBY");
                              log.setText("> awaiting command...");
                          }

                          else if (c.equals("CLOSE"))
                              stopSelf();
                      });
                  }

                  int type = Build.VERSION.SDK_INT >= 26
                      ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      : WindowManager.LayoutParams.TYPE_PHONE;

                  WindowManager.LayoutParams p =
                      new WindowManager.LayoutParams(
                          700,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  p.gravity = Gravity.TOP | Gravity.START;
                  p.x = 20;
                  p.y = 150;

                  wm.addView(panel,p);
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (panel != null) wm.removeView(panel);
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CapybaraToolkit-APK
          path: app/build/outputs/apk/debug/app-debug.apk
